# EcoGuardIsrael - NewsMonitoringAgent configuration

# The news sites to monitor for wildfire-related news.
rss_feeds:
  - name: "Ynet"
    url: "https://www.ynet.co.il/Integration/StoryRss2.xml"
  - name: "Walla News"
    url: "https://rss.walla.co.il/feed/22"
  - name: "Mako"
    url: "https://rcs.mako.co.il/rss/news-israel.xml"

# The keywords to look for in the news articles. The agent will only process articles that contain at least one of these keywords.
keywords:
  - "שריפה"
  - "שרפה"
  - "דליקה"
  - "יער"
  - "כבאות"
  - "כבאים"
  - "אש"

# The configuration for the news monitoring agent.
scraping:
  interval_seconds: 300      # how often run_forever() polls the feeds
  request_timeout_seconds: 10

# The configuration for the LLM used to analyze the news articles.
llm:
  provider: "groq"           # "groq" or "gemini"
  # "llama-3.1-8b-instant" has been decommissioned by Groq (calls now fail
  # with HTTP 404 "model_not_found") - "openai/gpt-oss-20b" is the closest
  # available fast/cheap model on this account. It is a *reasoning* model
  # (spends some of its token budget on a hidden "reasoning" pass before the
  # final JSON reply), so max_tokens below is sized with headroom for that,
  # and reasoning_effort is set to "low" to keep it fast for this
  # high-volume, latency-sensitive use case.
  model: "openai/gpt-oss-20b"
  reasoning_effort: "low"     # Groq-specific; ignored by other providers
  api_key_env: "GROQ_API_KEY" # name of the env var holding the key (see .env)
  temperature: 0.0
  max_tokens: 200             # budget for the short {"locationName": ...} extraction reply (incl. reasoning tokens)
  translation_max_tokens: 600 # budget for translating title+summary+locationName to English
  request_timeout_seconds: 15

# Geocoding settings for converting location names to geographic coordinates via Nominatim
geocoding:
  user_agent: "EcoGuardIsrael-NewsMonitoringAgent/1.0 (yaeldoron32123@gmail.com)" # Mail is required by Nominatim policy- if there's an issue with request rates
  country_bias: "il"         
  timeout_seconds: 10
  min_delay_seconds: 1 # Nominatim usage policy: max 1 req/sec

logging:
  level: "INFO"
  file: "logs/news_monitoring_agent.log" # Path to the log file for the news monitoring agent
